services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentaudit}
      POSTGRES_USER: ${POSTGRES_USER:-talentaudit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentaudit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      TALENTAUDIT_ENVIRONMENT: ${TALENTAUDIT_ENVIRONMENT:-local}
      TALENTAUDIT_LOG_LEVEL: ${TALENTAUDIT_LOG_LEVEL:-INFO}
      TALENTAUDIT_DATABASE_URL: ${TALENTAUDIT_DATABASE_URL:-postgresql+psycopg://talentaudit:talentaudit@db:5432/talentaudit}
      TALENTAUDIT_DB_CONNECT_TIMEOUT_SECONDS: ${TALENTAUDIT_DB_CONNECT_TIMEOUT_SECONDS:-3}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

